name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t docker-cicd-aws:latest .

  push-to-ecr:
    runs-on: ubuntu-latest
    needs: docker

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            );

            console.log(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              repository_id: payload.repository_id,
              repository_owner: payload.repository_owner,
              repository_owner_id: payload.repository_owner_id,
              ref: payload.ref,
              event_name: payload.event_name
            }, null, 2));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::675962431653:role/GitHubActionsDockerCICD
          role-session-name: GitHubActions
          aws-region: eu-central-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker image
        run: |
          docker build -t docker-cicd-aws:latest .


      - name: Tag Docker image
        run: |
          docker tag docker-cicd-aws:latest \
            675962431653.dkr.ecr.eu-central-1.amazonaws.com/docker-cicd-aws:latest


      - name: Push Docker image to ECR
        run: |
          docker push \
            675962431653.dkr.ecr.eu-central-1.amazonaws.com/docker-cicd-aws:latest